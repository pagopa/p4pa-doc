openapi: 3.0.3
info:
  title: P4PA-PDND-Service API
  description: API and Models.
  version: 0.0.1
servers:
  - url: "http://localhost:8080"
paths:
  /anpr-service-e002/citizen:
    get:
      summary: Retrieve citizen data
      description: Returns detailed information about a citizen based on their fiscal code.
      operationId: getCitizenDataByFiscalCode
      tags:
        - Anpr
      parameters:
        - name: fiscalCode
          in: query
          description: The fiscal code of the citizen
          required: true
          schema:
            type: string
            example: RSSMRA85M01H501Z
        - name: organizationId
          in: query
          description: The organization ID
          required: true
          schema:
            type: integer
            format: int64
        - name: subUnitCode
          in: query
          description: The sub unit code
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Citizen'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
        '404':
          description: Citizen not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
  /token:
    get:
      summary: Retrieve voucher token
      description: get voucher for specific service
      operationId: getVoucherToken
      tags:
        - p4pa-pdnd
      parameters:
        - name: service
          in: query
          description: The name of pdnd services
          required: true
          schema:
            type: 'PdndServicesEnum'
            example: SEND
        - name: organizationId
          in: query
          description: The organization ID
          required: true
          schema:
            type: integer
            format: int64
        - name: subUnitCode
          in: query
          description: The sub unit code
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: 'PdndAuthData'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
        '404':
          description: Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdndServicesErrorDTO'
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Address:
      type: object
      properties:
        street:
          type: string
          example: Via Roma 10
        city:
          type: string
          example: Roma
        postalCode:
          type: string
          example: 00100
        country:
          type: string
          example: Italy
    Citizen:
      type: object
      properties:
        firstName:
          type: string
          example: Mario
        lastName:
          type: string
          example: Rossi
        dateOfBirth:
          type: string
          format: YYYY-MM-DD
          example: '2021-11-15'
        address:
          $ref: '#/components/schemas/Address'
    PdndServicesErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - PDND_SERVICES_NOT_FOUND
            - PDND_SERVICES_BAD_REQUEST
            - PDND_SERVICES_GENERIC_ERROR
            - PDND_SERVICES_TOO_MANY_REQUESTS
            - PDND_SERVICES_UNAUTHORIZED
            - PDND_SERVICES_FORBIDDEN
            - PDND_SERVICES_CONFLICT
        code:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorFieldDTO"
        traceId:
          type: string
    ErrorFieldDTO:
      type: object
      required:
        - field
        - error
        - message
      properties:
        field:
          type: string
        error:
          type: string
        message:
          type: string
    PdndServicesEnum:
      type: string
      enum:
        - SEND
        - C003
        - C030