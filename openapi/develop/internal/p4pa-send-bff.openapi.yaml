openapi: 3.1.0
info:
  title: p4pa-send-bff
  description: Api and Models
  version: 1.0.0
paths:
  /organizations/{organizationId}/senders:
    get:
      tags:
        - organization-sender
      operationId: getOrganizationSenders
      summary: "Returns the list of SEND-enabled organization and sub-units accessible to the operator"
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSenderDTO'
        '401':
          description: Unauthorized - Missing or invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDTO'
  /organizations/{organizationId}/campaigns:
    get:
      tags:
        - Campaign
      operationId: getCampaignsByFilters
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: dateFrom
          required: true
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          required: true
          in: query
          schema:
            type: string
            format: date
        - name: orgSubUnitCode
          in: query
          schema:
            type: string
        - name: campaignName
          in: query
          schema:
            type: string
        - name: externalCampaignId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Page of campaigns
          content:
            application/json:
              schema:
                type: 'PagedCampaign'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized - Missing or invalid token
        '500':
          description: Internal Server Error
      x-spring-paginated: true
components:
  schemas:
    OrganizationSenderDTO:
      type: object
      required:
        - organizationId
      properties:
        organizationId:
          type: integer
          format: int64
        subUnitCode:
          type: string
        orgName:
          type: string
    ErrorDTO:
      type: object
      required:
        - category
        - code
        - message
      properties:
        category:
          type: string
          enum:
            - NOT_FOUND
            - BAD_REQUEST
            - GENERIC_ERROR
            - TOO_MANY_REQUESTS
            - CONFLICT
            - FORBIDDEN
            - UNAUTHORIZED
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
